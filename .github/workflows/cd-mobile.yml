name: CD Mobile

# Separate deployable: a failing mobile build does not block an API or web release.
# Path-filtered: runs only when the MAUI app or the shared library it references changes.
on:
  workflow_dispatch:
  push:
    branches: [main, master, develop, dev]
    paths:
      - 'Frontend_Mobile/**'
      - "QULOOBUL _MOE'MIENEEN_Shared/**"
      - '.github/workflows/cd-mobile.yml'

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      MOBILE_PROJECT: Frontend_Mobile/Frontend_Mobile.csproj
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        # dev/develop builds talk to the staging API; everything else to production.
      API_ENV: ${{ (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/develop') && 'Staging' || 'Production' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android

      - name: Restore
        run: dotnet restore "$MOBILE_PROJECT"

      - name: Build
        run: dotnet build "$MOBILE_PROJECT" -f net10.0-android -c Release --no-restore -warnaserror -p:ApiEnvironment="$API_ENV"

      - name: Decode signing keystore
        if: ${{ env.KEYSTORE_B64 != '' }}
        run: echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/npo.keystore"

      - name: Publish signed APK
        if: ${{ env.KEYSTORE_B64 != '' }}
        run: |
          dotnet publish "$MOBILE_PROJECT" -f net10.0-android -c Release -o ./apk -p:ApiEnvironment="$API_ENV" \
            -p:AndroidKeyStore=true \
            -p:AndroidSigningKeyStore="$RUNNER_TEMP/npo.keystore" \
            -p:AndroidSigningKeyAlias='${{ secrets.ANDROID_KEY_ALIAS }}' \
            -p:AndroidSigningKeyPass='${{ secrets.ANDROID_KEY_PASSWORD }}' \
            -p:AndroidSigningStorePass='${{ secrets.ANDROID_KEYSTORE_PASSWORD }}'

      - name: Publish unsigned APK
        if: ${{ env.KEYSTORE_B64 == '' }}
        run: |
          echo "::warning::ANDROID_KEYSTORE_BASE64 is not set — producing an unsigned build."
          dotnet publish "$MOBILE_PROJECT" -f net10.0-android -c Release -o ./apk -p:ApiEnvironment="$API_ENV"

      # Side-loaded for the client demo and for marking. Play Store
      # distribution is Phase 2 and is deliberately not automated.
      # Every run uploads: pushes to dev/release branches and manual runs. Feature-branch
      # pushes never trigger this workflow, and the 14-day retention bounds the quota.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: npo-android-apk-${{ env.API_ENV }}
          path: ./apk/*.apk
          retention-days: 14
