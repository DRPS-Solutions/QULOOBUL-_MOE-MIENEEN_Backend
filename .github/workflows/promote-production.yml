name: Promote to Production

# The manual gate: cd-production.yml stops at the smoke-tested prod slot, and a person starts
# this from Actions > Promote to Production > Run workflow. Required reviewers on the
# production environment need a paid plan for a private repo, so the manual run is the approval.
on:
  workflow_dispatch:

jobs:
  swap:
    # Only master's build is promoted, whatever branch the run was started from.
    if: ${{ github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'

      # Built here, not passed as an artifact: this runs whenever someone promotes, and an
      # artifact could expire (or the quota be full) before it runs.
      - name: Publish Blazor client
        run: |
          dotnet publish "Frontend_BlazorWeb/Frontend_BlazorWeb.csproj" -c Release -o ./web-build
          mv ./web-build/wwwroot ./web

      - uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # Reverse a bad release by running this same swap again.
      - name: Swap slots
        run: |
          az webapp deployment slot swap \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "${{ vars.AZURE_WEBAPP_NAME_PROD }}" \
            --slot staging \
            --target-slot production

      # The client ships after the swap, so it never goes live ahead of the API it was built against.
      # Points the client at this API and writes its CSP (hash of the build-specific import map).
      - name: Configure Blazor client for Static Web Apps
        run: |
          host=$(az webapp show -g "${{ vars.AZURE_RESOURCE_GROUP }}" -n "${{ vars.AZURE_WEBAPP_NAME_PROD }}" --query defaultHostName -o tsv)
          bash .github/scripts/web-config.sh ./web "https://$host"

      - name: Deploy Blazor client to Static Web Apps
        if: ${{ vars.AZURE_STATIC_WEB_APP_PROD != '' }}
        uses: Azure/static-web-apps-deploy@4d27395796ac319302594769cfe812bd207490b1 # v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_PROD }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: ./web
          skip_app_build: true
