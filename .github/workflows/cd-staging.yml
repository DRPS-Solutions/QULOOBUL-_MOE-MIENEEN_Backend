name: CD Staging

on:
  push:
    branches: [develop, dev]

# Builds only the API project. The MAUI app ships via cd-mobile.yml and the
# Blazor client is built by the Static Web Apps action from source.
env:
  PROJECT: "QULOOBUL _MOE'MIENEEN_Backend/QULOOBUL _MOE'MIENEEN_Backend.csproj"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore "$PROJECT"

      - name: Build (warnings are errors)
        run: dotnet build "$PROJECT" -c Release --no-restore -warnaserror

      - name: Test
        run: |
          if ! grep -rq 'Microsoft.NET.Test.Sdk' --include='*.csproj' .; then
            echo "::warning::No test project in the repository yet - the test gate is inactive."
            exit 0
          fi
          dotnet test "$PROJECT" -c Release --no-build --collect:"XPlat Code Coverage"

      - name: Publish
        run: dotnet publish "$PROJECT" -c Release --no-build -o ./publish

      - uses: actions/upload-artifact@v4
        with:
          name: api
          path: ./publish

  deploy:
    needs: build
    # Skipped until Azure is provisioned and AZURE_WEBAPP_NAME is set as a repository variable.
    if: ${{ vars.AZURE_WEBAPP_NAME != '' }}
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/download-artifact@v4
        with:
          name: api
          path: ./publish

      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy API to staging slot
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          slot-name: staging
          package: ./publish

      - name: Deploy Blazor client to Static Web Apps
        if: ${{ vars.AZURE_STATIC_WEB_APP != '' }}
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: src/Npo.Web
          output_location: wwwroot

      # Migrations run against the database the live build is still using,
      # so every migration must be backward compatible.
      - name: Apply EF Core migrations
        env:
          ConnectionStrings__Default: ${{ secrets.STAGING_DB_CONNECTION }}
        run: |
          dotnet tool install --global dotnet-ef
          dotnet ef database update --project "$PROJECT"

      - name: Smoke test
        run: |
          curl -fsS --retry 5 --retry-all-errors --retry-delay 10 \
            "https://${{ vars.AZURE_WEBAPP_NAME }}-staging.azurewebsites.net/health"
