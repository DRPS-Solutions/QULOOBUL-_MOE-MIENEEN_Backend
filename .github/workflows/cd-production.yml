name: CD Production

on:
  push:
    branches: [main, master]

# Builds the API and the Blazor client. The MAUI app ships via cd-mobile.yml; the
# Blazor client is published here and deployed prebuilt, so its CSP can hash the build.
env:
  PROJECT: "QULOOBUL _MOE'MIENEEN_Backend/QULOOBUL _MOE'MIENEEN_Backend.csproj"

jobs:
  build:
    runs-on: ubuntu-latest
    # Integration tests migrate a throwaway database on this container (ApiIntegrationTests.cs).
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: Ci_Throwaway_Passw0rd
        ports: ['1433:1433']
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P Ci_Throwaway_Passw0rd -Q 'SELECT 1'"
          --health-interval 10s --health-timeout 5s --health-retries 12
    env:
      TEST_SQL_CONNECTION: Server=localhost,1433;User Id=sa;Password=Ci_Throwaway_Passw0rd;TrustServerCertificate=True
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore "$PROJECT"

      - name: Build (warnings are errors)
        run: dotnet build "$PROJECT" -c Release --no-restore -warnaserror

      - name: Test
        run: dotnet test "Backend.Tests/Backend.Tests.csproj" -c Release -warnaserror --collect:"XPlat Code Coverage" --results-directory coverage

      - name: Coverage gate
        run: bash .github/scripts/coverage-gate.sh 70

      # Proves both projects publish. Later jobs republish from the same commit
      # instead of passing artifacts, so a full artifact quota cannot block a release.
      - name: Publish
        run: |
          dotnet publish "$PROJECT" -c Release --no-build -o ./publish
          dotnet publish "Frontend_BlazorWeb/Frontend_BlazorWeb.csproj" -c Release -o ./web

  deploy-slot:
    needs: build
    # Skipped until Azure is provisioned and AZURE_WEBAPP_NAME_PROD is set as a repository variable.
    if: ${{ vars.AZURE_WEBAPP_NAME_PROD != '' }}
    runs-on: ubuntu-latest
    # Unprotected environment - holds the production secrets, but no reviewers.
    # Live traffic is still served by the old build at this point.
    environment: production-slot
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish API
        run: dotnet publish "$PROJECT" -c Release -o ./publish

      - uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy API to production staging slot
        id: deploy
        uses: azure/webapps-deploy@02a81bead70021f5284939794bcec79c271ab383 # v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME_PROD }}
          slot-name: staging
          package: ./publish

      # Azure SQL admits only App Service and named developer IPs, so the runner opens a rule for itself.
      - name: Open SQL firewall for this runner
        run: |
          ip=$(curl -fsS https://api.ipify.org)
          az sql server firewall-rule create -g "${{ vars.AZURE_RESOURCE_GROUP }}" -s "${{ vars.AZURE_SQL_SERVER }}" \
            -n "gh-${{ github.run_id }}" --start-ip-address "$ip" --end-ip-address "$ip"

      # A failure here stops the run before the swap - production is untouched.
      - name: Apply EF Core migrations
        env:
          ConnectionStrings__Default: ${{ secrets.PRODUCTION_DB_CONNECTION }}
          Seed__AdminEmail: ${{ secrets.SEED_ADMIN_EMAIL }}
          Seed__AdminPassword: ${{ secrets.SEED_ADMIN_PASSWORD }}
        run: |
          dotnet tool install --global dotnet-ef
          dotnet ef database update --project "$PROJECT"

      - name: Close SQL firewall
        if: always()
        run: az sql server firewall-rule delete -g "${{ vars.AZURE_RESOURCE_GROUP }}" -s "${{ vars.AZURE_SQL_SERVER }}" -n "gh-${{ github.run_id }}" || true

      # SMOKE_EMAIL / SMOKE_PASSWORD: a low-privilege account kept for this check, not the seed admin.
      - name: Smoke test the slot
        env:
          SMOKE_EMAIL: ${{ secrets.SMOKE_EMAIL }}
          SMOKE_PASSWORD: ${{ secrets.SMOKE_PASSWORD }}
        run: bash .github/scripts/smoke-test.sh "${{ steps.deploy.outputs.webapp-url }}"

  swap:
    needs: deploy-slot
    runs-on: ubuntu-latest
    # Protected environment: add the project lead as a required reviewer in
    # Settings > Environments > production. That setting is the approval gate.
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'

      # Built here, not passed as an artifact: this job waits on approval, and an
      # artifact could expire (or the quota be full) before it runs.
      - name: Publish Blazor client
        run: |
          dotnet publish "Frontend_BlazorWeb/Frontend_BlazorWeb.csproj" -c Release -o ./web-build
          mv ./web-build/wwwroot ./web

      - uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # Reverse a bad release by running this same swap again.
      - name: Swap slots
        run: |
          az webapp deployment slot swap \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "${{ vars.AZURE_WEBAPP_NAME_PROD }}" \
            --slot staging \
            --target-slot production

      # The client ships after the swap, so it never goes live ahead of the API it was built against.
      # Points the client at this API and writes its CSP (hash of the build-specific import map).
      - name: Configure Blazor client for Static Web Apps
        run: |
          host=$(az webapp show -g "${{ vars.AZURE_RESOURCE_GROUP }}" -n "${{ vars.AZURE_WEBAPP_NAME_PROD }}" --query defaultHostName -o tsv)
          bash .github/scripts/web-config.sh ./web "https://$host"

      - name: Deploy Blazor client to Static Web Apps
        if: ${{ vars.AZURE_STATIC_WEB_APP_PROD != '' }}
        uses: Azure/static-web-apps-deploy@4d27395796ac319302594769cfe812bd207490b1 # v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_PROD }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: ./web
          skip_app_build: true
