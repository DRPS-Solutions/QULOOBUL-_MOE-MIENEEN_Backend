# EF Core migrations are one-shot, per-constraint AddCheckConstraint/DropCheckConstraint
# calls; copy-paste repetition is inherent and refactoring them would diverge from the
# model snapshot. Exclude from duplication detection only (still analysed for bugs/smells).
sonar.cpd.exclusions=**/Migrations/**

# OWASP ZAP reports (docs/penetration-test.md): generated evidence, not source.
# Each rescan repeats the last one, which reads as duplication.
sonar.exclusions=api-scan*.html,web-baseline.html
